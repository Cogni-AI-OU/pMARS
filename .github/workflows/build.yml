name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: Build (${{ matrix.config }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config: [X11, Curses, Server, SmallMem]
        include:
          - config: X11
            cflags: "-O -DEXT94 -DXWINGRAPHX -DPERMUTATE -DRWLIMIT"
            libs: "-lX11"
            deps: "libx11-dev"
          - config: Curses
            cflags: "-O -DEXT94 -DGRAPHX -DPERMUTATE -DRWLIMIT"
            libs: "-lncurses"
            deps: "libncurses5-dev"
          - config: Server
            cflags: "-O -DEXT94 -DSERVER -DPERMUTATE -DRWLIMIT"
            libs: ""
            deps: ""
          - config: SmallMem
            cflags: "-O -DEXT94 -DSERVER -DSMALLMEM -DPERMUTATE -DRWLIMIT"
            libs: ""
            deps: ""

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      if: matrix.deps != ''
      run: |
        sudo apt-get update
        sudo apt-get install -y ${{ matrix.deps }}

    - name: Compile
      run: |
        cd src
        make clean
        make CFLAGS="${{ matrix.cflags }}" LIB="${{ matrix.libs }}"

    - name: Verify executable
      run: |
        ls -l src/pmars
        ./src/pmars -h
