name: Redcode Assembly Verification

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  verify-assembly:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build pMARS
        run: |
          cd src
          make server

      - name: Verify .red.asm files
        run: |
          # Add src to PATH
          export PATH=$PATH:$(pwd)/src
          
          # Find all .red.asm files
          ASM_FILES=$(find . -name "*.red.asm")
          
          if [ -z "$ASM_FILES" ]; then
            echo "No .red.asm files found to verify."
            exit 0
          fi
          
          EXIT_CODE=0
          for asm in $ASM_FILES; do
            # The corresponding .red file should have the same name without .asm
            red="${asm%.asm}"
            
            if [ ! -f "$red" ]; then
              echo "::error file=$asm::Corresponding .red file not found: $red"
              EXIT_CODE=1
              continue
            fi
            
            echo "Verifying $asm against $red ..."
            
            # Assemble the .red file. 
            # Redirect stderr to /dev/null to avoid warnings in the diff, 
            # as the .red.asm files only contain the listing.
            pmars -A "$red" 2>/dev/null > assembled_tmp.asm
            
            # Compare. Using -u for readable diff on failure.
            if ! diff -u "$asm" assembled_tmp.asm; then
              echo "::error file=$asm::Assembly mismatch for $red"
              EXIT_CODE=1
            else
              echo "✅ Match: $red"
            fi
            rm -f assembled_tmp.asm
          done
          
          exit $EXIT_CODE
