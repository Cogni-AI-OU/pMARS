name: Test

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths-ignore:
      - '.github/workflows/test-tournaments.yml'
      - 'tests/tournaments/**'
      - 'warriors/tournaments/**'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - '.github/workflows/test-tournaments.yml'
      - 'tests/tournaments/**'
      - 'warriors/tournaments/**'

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    with:
      upload-artifact: true

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get added warriors
        id: added-warriors
        uses: tj-actions/changed-files@v44
        with:
          files: "**/*.red"
          diff_filter: A

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: pmars-Server
          path: bin/

      - name: Run test
        run: |
          chmod +x bin/pmars
          echo "Validating pMARS with standard warrior..."
          ./bin/pmars -A warriors/validate.red
          
          if [ "${{ steps.added-warriors.outputs.any_changed }}" == "true" ]; then
            echo "Testing added warriors..."
            for file in ${{ steps.added-warriors.outputs.all_changed_files }}; do
              echo "Testing $file..."
              # Use -l 1000 to accommodate larger warriors
              ./bin/pmars -l 1000 -A "$file"
            done
          else
            echo "No new warriors added."
          fi
