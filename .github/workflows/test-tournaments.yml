name: Tournament Tests

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/test-tournaments.yml'
      - 'tests/tournaments/**'
      - 'warriors/tournaments/**'
  pull_request:
    branches: [ master ]
    paths:
      - '.github/workflows/test-tournaments.yml'
      - 'tests/tournaments/**'
      - 'warriors/tournaments/**'
  workflow_dispatch:
  pull_request_review:
    types: [submitted]

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    with:
      upload-artifact: true

  test-tournaments:
    name: Tournament Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: pmars-Server
          path: bin/
      - name: Run Tournament Assembly Tests
        run: |
          chmod +x bin/pmars
          echo "Checking all warriors in warriors/tournaments/..."
          if find warriors/tournaments/ -name "*.red" -exec ./bin/pmars -A {} + > /dev/null; then
            echo "All warriors assembled successfully."
          else
            echo "Error: Some warriors failed to assemble!"
            find warriors/tournaments/ -name "*.red" | while read f; do
              ./bin/pmars -A "$f" > /dev/null || echo "FAILED: $f"
            done
            exit 1
          fi
      - name: Run Specialized Tournament Tests
        run: |
          echo "Running Makefile-based tests in tests/tournaments/..."
          failed=0
          for d in tests/tournaments/*/; do
            if [ -d "$d" ] && [ -f "${d}Makefile" ]; then
              echo "::group::Testing $d"
              if ! make -C "$d" test; then
                echo "FAILED: $d"
                failed=1
              fi
              echo "::endgroup::"
            fi
          done
          if [ $failed -ne 0 ]; then
            exit 1
          fi
