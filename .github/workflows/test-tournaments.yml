name: Test Tournaments

on:
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    with:
      upload-artifact: true

  test:
    name: Tournament Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: pmars-Server
          path: bin/
      - name: Run ICWT tests
        run: |
          chmod +x bin/pmars
          find warriors/tournaments/icwt* -name "*.red" -exec ./bin/pmars -A {} + > /dev/null
