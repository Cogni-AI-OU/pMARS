name: Tournament Tests

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/test-tournaments.yml'
      - 'tests/tournaments/**'
      - 'warriors/tournaments/**'
  pull_request:
    branches: [ master ]
    paths:
      - '.github/workflows/test-tournaments.yml'
      - 'tests/tournaments/**'
      - 'warriors/tournaments/**'
  workflow_dispatch:
  pull_request_review:
    types: [submitted]

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    with:
      upload-artifact: true

  test-tournaments:
    name: Tournament Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: pmars-Server
          path: bin/

      - name: Run tournament tests
        run: |
          chmod +x bin/pmars
          export PATH=$PATH:$(pwd)/bin
          
          echo "Running regression tests for all tournaments..."
          # Loop through each tournament directory and run its tests
          for dir in tests/tournaments/*/; do
            if [ -f "${dir}Makefile" ]; then
              echo "Testing tournament in $dir..."
              make -C "$dir" test
            fi
          done
