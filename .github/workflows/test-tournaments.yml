name: Tournament Tests

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/test-tournaments.yml'
      - 'tests/tournaments/**'
      - 'warriors/tournaments/**'
  pull_request:
    branches: [ master ]
    paths:
      - '.github/workflows/test-tournaments.yml'
      - 'tests/tournaments/**'
      - 'warriors/tournaments/**'
  workflow_dispatch:
  pull_request_review:
    types: [submitted]

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    with:
      upload-artifact: true

  test-tournaments:
    name: Tournament Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: pmars-Server
          path: bin/

      - name: Run Tournament Assembly Tests
        run: |
          chmod +x bin/pmars
          export PATH=$PATH:$(pwd)/bin
          echo "Checking all warriors in warriors/tournaments/..."
          # First pass: try to assemble all with high instruction limit (-l 8000)
          if find warriors/tournaments/ -name "*.red" -exec ./bin/pmars -l 8000 -A {} + > /dev/null 2>&1; then
            echo "All warriors assembled successfully."
          else
            echo "Some warriors failed with default settings. Retrying with compatibility flags..."
            failed=0
            count=0
            find warriors/tournaments/ -name "*.red" > warriors_list.txt
            while read -r f; do
              count=$((count + 1))
              # Try default '94
              if ! ./bin/pmars -l 8000 -A "$f" > /dev/null 2>&1; then
                # Try '88 compatibility for older warriors
                if ! ./bin/pmars -8 -l 8000 -A "$f" > /dev/null 2>&1; then
                  echo "FAILED: $f"
                  ./bin/pmars -l 8000 -A "$f" # Show errors in log
                  failed=$((failed + 1))
                fi
              fi
            done < warriors_list.txt
            rm warriors_list.txt
            echo "Processed $count warriors, $failed failures."
            if [ $failed -ne 0 ]; then
              exit 1
            fi
          fi

      - name: Run Specialized Tournament Tests
        run: |
          echo "Running Makefile-based tests in tests/tournaments/..."
          failed=0
          for d in tests/tournaments/*/; do
            if [ -d "$d" ] && [ -f "${d}Makefile" ]; then
              echo "::group::Testing $d"
              if ! make -C "$d" test; then
                echo "FAILED: $d"
                failed=1
              fi
              echo "::endgroup::"
            fi
          done
          if [ $failed -ne 0 ]; then
            exit 1
          fi
