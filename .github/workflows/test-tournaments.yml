name: Tournament Tests

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/test-tournaments.yml'
      - 'tests/tournaments/**'
      - 'warriors/tournaments/**'
  pull_request:
    branches: [ master ]
    paths:
      - '.github/workflows/test-tournaments.yml'
      - 'tests/tournaments/**'
      - 'warriors/tournaments/**'
  workflow_dispatch:
  pull_request_review:
    types: [submitted]

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    with:
      upload-artifact: true

  test-tournaments:
    name: Tournament Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: pmars-Server
          path: bin/

      - name: Prepare environment
        run: |
          chmod +x bin/pmars
          mkdir -p src
          cp bin/pmars src/pmars
          cp bin/pmars ./pmars
          export PATH=$PATH:$(pwd)/bin
          echo "$(pwd)/bin" >> $GITHUB_PATH

      - name: Run Tournament Assembly Tests
        run: |
          echo "Checking all warriors in warriors/tournaments/..."
          # First pass: try to assemble all with high instruction limit (-l 8000)
          if find warriors/tournaments/ -name "*.red" -exec ./bin/pmars -p ${MAXPROCESSES:-64} -l 8000 -A {} + > /dev/null 2>&1; then
            echo "All warriors assembled successfully."
          else
            echo "Some warriors failed with default settings. Retrying with compatibility flags..."
            failed=0
            count=0
            find warriors/tournaments/ -name "*.red" > warriors_list.txt
            while read -r f; do
              count=$((count + 1))
              # Default settings for individual retry
              CORESIZE=8000
              MAXLENGTH=8000
              MAXPROCESSES=64
              
              # Try to extract settings from ;assert lines if present
              CS=$(grep -i ";assert" "$f" | grep -oiP "CORESIZE\s*(?:==|=)\s*\K\d+" | head -n 1 || echo "")
              [ ! -z "$CS" ] && CORESIZE=$CS
              ML=$(grep -i ";assert" "$f" | grep -oiP "MAXLENGTH\s*(?:==|=)\s*\K\d+" | head -n 1 || echo "")
              [ ! -z "$ML" ] && MAXLENGTH=$ML
              MP=$(grep -i ";assert" "$f" | grep -oiP "MAXPROCESSES\s*(?:==|=)\s*\K\d+" | head -n 1 || echo "")
              [ ! -z "$MP" ] && MAXPROCESSES=$MP

              # Try default '94
              if ! ./bin/pmars -s $CORESIZE -p ${MAXPROCESSES:-64} -l $MAXLENGTH -A "$f" > /dev/null 2>&1; then
                # Try '88 compatibility for older warriors
                if ! ./bin/pmars -8 -s $CORESIZE -p ${MAXPROCESSES:-64} -l $MAXLENGTH -A "$f" > /dev/null 2>&1; then
                  echo "FAILED: $f"
                  echo "Default '94 error:"
                  ./bin/pmars -s $CORESIZE -p ${MAXPROCESSES:-64} -l $MAXLENGTH -A "$f"
                  echo "ICWS'88 error:"
                  ./bin/pmars -8 -s $CORESIZE -p ${MAXPROCESSES:-64} -l $MAXLENGTH -A "$f"
                  failed=$((failed + 1))
                fi
              fi
            done < warriors_list.txt
            rm warriors_list.txt
            echo "Processed $count warriors, $failed failures."
            if [ $failed -ne 0 ]; then
              exit 1
            fi
          fi

      - name: Run Specialized Tournament Tests
        run: |
          echo "Running Makefile-based tests in tests/tournaments/..."
          failed=0
          for d in tests/tournaments/*/; do
            if [ -d "$d" ] && [ -f "${d}Makefile" ]; then
              echo "::group::Testing $d"
              if ! make -C "$d" test; then
                echo "FAILED: $d"
                failed=1
              fi
              echo "::endgroup::"
            fi
          done
          if [ $failed -ne 0 ]; then
            exit 1
          fi
