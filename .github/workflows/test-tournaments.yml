name: Tournament Tests

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/test-tournaments.yml'
      - 'tests/tournaments/**'
      - 'warriors/tournaments/**'
  pull_request:
    branches: [ master ]
    paths:
      - '.github/workflows/test-tournaments.yml'
      - 'tests/tournaments/**'
      - 'warriors/tournaments/**'
  workflow_dispatch:
  pull_request_review:
    types: [submitted]

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    with:
      upload-artifact: true

  test-tournaments:
    name: Tournament Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get added warriors
        id: added-warriors
        uses: tj-actions/changed-files@v44
        with:
          files: "warriors/tournaments/**/*.red"
          diff_filter: A

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: pmars-Server
          path: bin/

      - name: Run tournament tests
        run: |
          chmod +x bin/pmars
          
          echo "Running regression tests for specific tournaments..."
          # Only run if the directory exists (it should if tests/tournaments was modified)
          [ -d tests/tournaments/icwt1989 ] && make -C tests/tournaments/icwt1989 test
          
          if [ "${{ steps.added-warriors.outputs.any_changed }}" == "true" ]; then
            echo "Testing newly added tournament warriors..."
            for file in ${{ steps.added-warriors.outputs.all_changed_files }}; do
              echo "Testing $file..."
              
              # Default settings
              CORESIZE=8000
              MAXLENGTH=100
              MAXCYCLES=80000
              MAXPROCESSES=8000
              MINDISTANCE=100
              
              # Try to extract settings from ;assert lines
              CS=$(grep -i ";assert" "$file" | grep -oiP "CORESIZE\s*==\s*\K\d+" | head -n 1 || echo "")
              [ ! -z "$CS" ] && CORESIZE=$CS
              ML=$(grep -i ";assert" "$file" | grep -oiP "MAXLENGTH\s*==\s*\K\d+" | head -n 1 || echo "")
              [ ! -z "$ML" ] && MAXLENGTH=$ML
              MC=$(grep -i ";assert" "$file" | grep -oiP "MAXCYCLES\s*==\s*\K\d+" | head -n 1 || echo "")
              [ ! -z "$MC" ] && MAXCYCLES=$MC
              MP=$(grep -i ";assert" "$file" | grep -oiP "MAXPROCESSES\s*==\s*\K\d+" | head -n 1 || echo "")
              [ ! -z "$MP" ] && MAXPROCESSES=$MP
              MD=$(grep -i ";assert" "$file" | grep -oiP "MINDISTANCE\s*==\s*\K\d+" | head -n 1 || echo "")
              [ ! -z "$MD" ] && MINDISTANCE=$MD
              
              # Ensure MINDISTANCE is at least MAXLENGTH
              if [ $MINDISTANCE -lt $MAXLENGTH ]; then
                MINDISTANCE=$MAXLENGTH
              fi

              echo "Settings: -s $CORESIZE -l $MAXLENGTH -c $MAXCYCLES -p $MAXPROCESSES -d $MINDISTANCE"
              ./bin/pmars -s $CORESIZE -l $MAXLENGTH -c $MAXCYCLES -p $MAXPROCESSES -d $MINDISTANCE -A "$file"
            done
          else
            echo "No new tournament warriors added."
          fi
